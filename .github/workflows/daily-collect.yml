name: Daily Trend & Ticket Collector

on:
  schedule:
    # 매일 한국 시간 오전 06:00 (UTC 21:00)
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run collector script
        run: |
          python collector.py

      - name: Commit and push changes if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/topics.json
          if git diff --staged --quiet; then
            echo "No changes in topics.json"
          else
            git commit -m "chore(data): 매일 오전 6시 트렌드 및 놀 티켓 데이터 자동 갱신 [skip ci]"
            git push
          fi
